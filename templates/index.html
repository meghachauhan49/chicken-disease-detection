<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chicken Disease Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="simple-page">

    <div class="prediction-card">

        <div class="logo">🐔</div>

        <h1>Chicken Disease Detection</h1>

        <p>
            AI-powered chicken disease prediction using EfficientNetB3
        </p>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <img
            id="preview"
            class="preview"
            alt="Selected Image"
        >

        <br>

        <button
            class="main-button"
            onclick="predictDisease()"
        >
            Predict Disease
        </button>

        <div id="result" class="result"></div>

        <br>

        <a href="/login" class="card-button">
            Go to Login
        </a>

    </div>

</div>


<script>

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");


imageInput.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (file) {

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";
        }

    }
);


async function predictDisease() {

    if (imageInput.files.length === 0) {

        alert(
            "Please select a chicken image first."
        );

        return;
    }


    const formData =
        new FormData();

    formData.append(
        "image",
        imageInput.files[0]
    );


    const result =
        document.getElementById("result");

    result.style.display =
        "block";

    result.innerHTML =
        "🔄 Analyzing image using AI model...";


    try {

        const response =
            await fetch(
                "/predict",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (data.error) {

            result.innerHTML =
                "❌ Error: " + data.error;

        } else {

            result.innerHTML =

                "<h3>Prediction Result</h3>" +

                "<p><strong>Predicted Disease:</strong> " +
                data.disease +
                "</p>" +

                "<p><strong>Confidence:</strong> " +
                (data.confidence * 100).toFixed(2) +
                "%</p>";

        }

    } catch (error) {

        result.innerHTML =
            "❌ Connection Error: " +
            error.message;

    }

}

</script>

</body>
</html>
